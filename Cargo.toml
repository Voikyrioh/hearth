[workspace]
resolver = "3"
members = ["crates/hearth-proto", "crates/hearth-agent", "crates/hearth-link", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
hearth-proto = { path = "crates/hearth-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal", "process", "io-util", "fs"] }
tracing = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "tokio", "query", "ws"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
sha2 = "0.11"
subtle = "2"
getrandom = "0.4"
clap = { version = "4", features = ["derive"] }
toml = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
gethostname = "1"
mac_address = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["trace"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
argon2 = "0.6"
zeroize = "1"
ulid = "3"
rpassword = "7"
async-trait = "0.1"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "network", "component"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
if-addrs = "0.15"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
