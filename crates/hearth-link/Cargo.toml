[package]
name = "hearth-link"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Expose `LinkManager::execute_raw` aux scénarios de résilience (route d'acte sans confirmation). Jamais
# activée par l'application : seul le dev-dependency ci-dessous la demande.
test-support = []

[dependencies]
hearth-proto.workspace = true
async-trait.workspace = true
futures-util.workspace = true
getrandom.workspace = true
if-addrs.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
ulid.workspace = true
zeroize.workspace = true
# Déjà dans l'arbre (rustls, agent) : dépendances directes pour la clé d'appareil (ADR-0023).
ring.workspace = true
base64.workspace = true

[dev-dependencies]
hearth-link = { path = ".", features = ["test-support"] }
hearth-agent = { path = "../hearth-agent" }
minisign.workspace = true
rcgen.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
time.workspace = true
