format = 2
id = "rich"
version = 3
family = "rich"
name = "Rich"
summary = "Fiche de test qui exerce tout le format."
status = "preview"
platform = "linux"

[image]
repository = "example/rich"
tag = "2.0"
game_updates = "at_install"

[owner]
uid = 1001
gid = 1002

[[variant]]
id = "java"
label = "Java"
help = "La version Java."
default = true

[[variant]]
id = "bedrock"
label = "Bedrock"
help = "La version Bedrock."
default = false
image_tag = "bedrock-2.0"

[[variant.env]]
name = "EDITION"
value = "bedrock"

[[folder]]
id = "world"
role = "world"
target = "/data/world"
read_only = false
backup = true

[[folder]]
id = "config"
role = "config"
target = "/data/config"
read_only = false
backup = true

[[folder]]
id = "mods"
role = "mods"
target = "/data/mods"
read_only = false
backup = false
drop_hint = "Dépose ici tes fichiers de mods."

[[port]]
id = "game"
container = 25565
protocol = "tcp"
role = "game"
publish = "always"
default_host = 25565
group = "base"
mapping = "same_number"
game_setting = "server_port"

[[port]]
id = "query"
container = 25566
protocol = "udp"
role = "query"
publish = "optional"
default_host = 25566
group = "base"
mapping = "nat"

[[port]]
id = "rcon"
container = 25575
protocol = "tcp"
role = "remote_console"
publish = "never"
mapping = "nat"

[[channel]]
id = "env"
kind = "env"

[[channel]]
id = "props"
kind = "file"
format = "kv_lines"
folder = "config"
path = "server.properties"
mode = "0640"
written_by_game = "at_stop"
raw_edit = false

[channel.kv]
separator = "="
comment = "#"
quote = "none"

[[channel]]
id = "xml"
kind = "file"
format = "xml_properties"
folder = "config"
path = "settings.xml"
mode = "0644"
written_by_game = "unverified"
raw_edit = true

[channel.xml]
root = "ServerSettings"
element = "property"
key_attr = "name"
value_attr = "value"

[[channel]]
id = "args"
kind = "args"

[[env]]
name = "PUID"
owner = "uid"

[[env]]
name = "PGID"
owner = "gid"

[[env]]
name = "RCON_PASSWORD"
secret = "rcon"

[[secret]]
id = "rcon"
origin = "generated"
length = 32
alphabet = "alnum"

[remote_console]
protocol = "source_rcon"
port = "rcon"
password = "rcon"

[[agreement]]
id = "eula"
title = "Contrat de licence"
url = "https://example.org/eula"
sentence = "J'ai lu le contrat et je l'accepte."

[agreement.binds]
channel = "env"
key = "EULA"
accepted_value = "TRUE"

[first_start]
ready_timeout_s = 3600
world_generation = true

[[first_start.download]]
what = "Fichiers du serveur"
source_label = "Steam"
bytes = 1073741824
evidence = { publisher = "https://example.org/size" }

[[first_start.stage]]
label = "Téléchargement"
log_contains = "Downloading"

[ready]
log_contains = "Done"
status = "tested"

[game_version]
after = "version "
until_any = [" "]
scheme = "dotted_numeric"
status = "tested"

[stop]
grace_s = 60
signal = "SIGTERM"
world_saved = "by_sequence"

[stop.sequence]
status = "tested"

[[stop.sequence.step]]
kind = "stdin_line"
line = "save"
quits = false

[[stop.sequence.step]]
kind = "wait_log"
contains = "Saved"
timeout_s = 30
required = true

[[stop.sequence.step]]
kind = "stdin_line"
line = "stop"
quits = true

[save]
status = "tested"

[[save.step]]
kind = "stdin_line"
line = "save"
quits = false

[[save.step]]
kind = "wait_log"
contains = "Saved"
timeout_s = 30
required = false

[resources]
cpu = { min_millis = 1000, recommended_millis = 2000, evidence = "measured" }
memory = { min_bytes = 1073741824, recommended_bytes = 2147483648, evidence = "measured_idle" }
disk = { install_bytes = 1073741824, evidence = { publisher = "https://example.org/size" } }

[worlds]
folder = "world"
unit = "dir"
depth = 1
names_setting = "level_name"
carried_by_world = ["difficulty"]
loaded_contains = "Preparing level"

[[not_exposed]]
key = "ops"
channel = "props"
why = "Liste des opérateurs : elle se gère depuis le jeu."

[[check]]
if = { setting = "hardcore", equals = "TRUE" }
then = { setting = "difficulty", must_equal = "hard" }
message = "Le mode hardcore impose la difficulté difficile."

[[migration]]
from_version = 1
ops = [{ rename = ["old-key", "new-key"] }, { retire = "old_mode" }]
