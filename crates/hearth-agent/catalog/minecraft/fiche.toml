# Minecraft Java, serveur officiel, Paper, Purpur, Fabric, Quilt, Forge, NeoForge, ou avec un pack de mods.
# Fiche publiée (HRT-116, ADR-0050 version 2, ADR-0053, ADR-0054) : essayée sur ses vraies images par le banc d'essai réel
# `tests/fiche_live_minecraft.rs`, sur la forge, le 15/11/2026 (relevé dans l'ADR-0053).
#
# Construite depuis la documentation de l'image `itzg/minecraft-server` (https://docker-minecraft-server.readthedocs.io)
# et l'inventaire des jeux (section 3.1), puis essayée sur ses vraies images : rien n'a été ajouté de mémoire.
#
# Ce que cette fiche NE fait pas, par décision (BR-MOD-016, BR-MOD-017) : aucune variable `CF_*`, aucun type
# `AUTO_CURSEFORGE`, aucune liste de téléchargements. Un pack CurseForge se dépose sous sa forme « pack serveur »
# (`.zip`, `mods` et `config` à la racine) : l'agent le range en lecture seule et le passe à l'image par `GENERIC_PACK`.

format = 2
id = "minecraft"
version = 5
family = "minecraft"
name = "Minecraft Java"
summary = "Le serveur de Minecraft Java : officiel, Paper, Purpur, Fabric, Quilt, Forge ou NeoForge, avec ou sans pack de mods."
status = "published"
platform = "linux"
illustration = "header.jpg"                # jeu absent de Steam : illustration originale embarquée (BR-FICHE-062, provenance à côté)

[image]
repository = "itzg/minecraft-server"
tag = "java25"                            # dernières versions du jeu : la 26.x demande Java 25 (essai réel du 15/11/2026 : « LATEST » = 26.3 ne démarre pas sur java21)
digest = "sha256:52a530ef9f3af25c0536c21e5b7c6bad7c1e1e7777fc186c4196c3d1f7635113"
game_updates = "every_start"              # VERSION=LATEST : l'image prend la dernière version à chaque démarrage ; une version précise reste telle quelle

[owner]
uid = 1000                                # l'image perd ses droits de root pour cet utilisateur (UID et GID ci-dessous)
gid = 1000

# Les variantes sont les moteurs de serveur relevés dans la documentation de l'image (la variable `TYPE`). Spigot n'est
# pas proposé : l'image dit que son téléchargement n'est plus pris en charge (accord de Voiky). `modrinth` : le moteur
# vient d'un pack Modrinth (`MODRINTH_MODPACK`). Java 17 pour les moteurs à mods : les packs de la version 1.20 en ont
# besoin (Prominence II : Fabric, 1.20.1, Java 17).
[[variant]]
id = "vanilla"
label = "Officiel"
help = "Le serveur de Mojang, sans mod."
default = true

[[variant.env]]
name = "TYPE"
value = "VANILLA"

[[variant]]
id = "paper"
label = "Paper"
help = "Un serveur rapide qui accepte des extensions (plugins), sans changer le jeu."
default = false

[[variant.env]]
name = "TYPE"
value = "PAPER"

[[variant]]
id = "purpur"
label = "Purpur"
help = "Comme Paper, avec encore plus de réglages."
default = false

[[variant.env]]
name = "TYPE"
value = "PURPUR"

[[variant]]
id = "fabric"
label = "Fabric"
help = "Un moteur léger pour les mods Fabric, avec Java 17 : les versions du jeu jusqu'à 1.20.4."
default = false
image_tag = "java17"
image_digest = "sha256:94b3e70f40c9ddc8ded7de2a7e7d6725254f08abaa63950d8402e4b107ccc4e2"

[[variant.env]]
name = "TYPE"
value = "FABRIC"

[[variant]]
id = "quilt"
label = "Quilt"
help = "Un moteur pour les mods Quilt, avec Java 17 : les versions du jeu jusqu'à 1.20.4."
default = false
image_tag = "java17"
image_digest = "sha256:94b3e70f40c9ddc8ded7de2a7e7d6725254f08abaa63950d8402e4b107ccc4e2"

[[variant.env]]
name = "TYPE"
value = "QUILT"

[[variant]]
id = "forge"
label = "Forge"
help = "Le moteur historique des mods, avec Java 17 : les versions du jeu jusqu'à 1.20.4."
default = false
image_tag = "java17"
image_digest = "sha256:94b3e70f40c9ddc8ded7de2a7e7d6725254f08abaa63950d8402e4b107ccc4e2"

[[variant.env]]
name = "TYPE"
value = "FORGE"

[[variant]]
id = "neoforge"
label = "NeoForge"
help = "Le successeur de Forge, avec Java 21."
default = false
image_tag = "java21"
image_digest = "sha256:498b79ce639cff2792206c23d6bd89c6fb43a2e446a4d97ff78ef1a784428caa"

[[variant.env]]
name = "TYPE"
value = "NEOFORGE"

[[variant]]
id = "modrinth"
label = "Selon le pack Modrinth"
help = "Le moteur et la version du jeu viennent du pack Modrinth que vous déposez."
default = false

[[variant.env]]
name = "TYPE"
value = "MODRINTH"

# Tout vit dans `/data` : le monde, les réglages du jeu, les mods installés par le pack.
[[folder]]
id = "data"
role = "data"
target = "/data"
read_only = false
backup = true

# Le dossier des packs déposés (HRT-124) : l'agent y range le pack sous un nom fixe, le conteneur le lit sans pouvoir
# l'écrire. Hors sauvegarde : le pack se redépose, le monde et les mods installés sont dans `/data`.
[[folder]]
id = "packs"
role = "packs"
target = "/packs"
read_only = true
backup = false

[[port]]
id = "game"
container = 25565
protocol = "tcp"
role = "game"
publish = "always"
default_host = 25565
mapping = "nat"                           # le port du jeu dans le conteneur reste 25565 ; les joueurs se connectent au port choisi sur le serveur

# La console interne de l'image (RCON), jamais publiée : outils de l'image (rcon-cli, sonde). Son rôle dans l'arrêt n'est pas vérifié par un essai réel.
[[port]]
id = "rcon"
container = 25575
protocol = "tcp"
role = "remote_console"
publish = "never"
mapping = "nat"

[[channel]]
id = "env"
kind = "env"

[[env]]
name = "UID"
owner = "uid"

[[env]]
name = "GID"
owner = "gid"

# Le tas de la JVM suit la limite de mémoire du service : `MEMORY` vide laisse la JVM calculer son tas, et
# `MaxRAMPercentage` le fixe à 75 % de la limite (le reste sert aux mémoires hors tas). La limite est donnée à la
# JVM par l'agent (`MaxRAM`, voir plus bas) : la détection de conteneur de la JVM n'est pas fiable. Documentation de l'image :
# « To let the JVM calculate heap size automatically, unset MEMORY with an empty value ». C'est donc le curseur de
# mémoire de l'installation qui règle Minecraft, jamais un chiffre de la fiche. Vérifié par le banc d'essai réel : avec
# 10 Gio, le serveur du pack occupe 7,6 Gio (tas de 7,5 Gio au plus).
[[env]]
name = "MEMORY"
value = ""

# Sur certains noyaux (6.18), la JVM ne lit pas la limite du conteneur et prendrait 75 % de la mémoire de l'HÔTE :
# l'agent ajoute donc lui-même `-XX:MaxRAM=<limite du service en octets>` à cette variable (`jvm_max_ram`).
[[env]]
name = "JVM_XX_OPTS"
value = "-XX:MaxRAMPercentage=75"
jvm_max_ram = true

# Attente de l'enregistrement du monde à l'arrêt : un gros monde ou un gros pack demande du temps (60 s par défaut).
[[env]]
name = "STOP_DURATION"
value = "180"

[[env]]
name = "ENABLE_RCON"
value = "true"

[[env]]
name = "RCON_PASSWORD"
secret = "rcon"

[[secret]]
id = "rcon"
origin = "generated"
length = 32
alphabet = "alnum"

[remote_console]
protocol = "source_rcon"
port = "rcon"
password = "rcon"

# Ce que Hearth peut faire de la console (HRT-267, ADR-0067) : tout ce qui est propre au jeu est ici. Les verbes refusés
# se demandent autrement ; les verbes sensibles exigent le mot de passe ; les commandes rapides sont celles de l'écran.
[remote_console.use]
reply_timeout_s = 10
refused = [
  { verb = "stop",    reason = "use_hearth_stop" },
  { verb = "restart", reason = "use_hearth_restart" },
  { verb = "reload",  reason = "breaks_server" },
]

[[remote_console.use.sensitive]]
verb = "op"
title = "Donner les droits d'opérateur à {joueur} ?"
sentence = "Un opérateur peut taper toutes les commandes du jeu depuis sa partie : changer le mode de jeu, bannir, donner des objets, modifier le monde. Il garde ces droits jusqu'à ce que vous les retiriez."
target = "first_arg"

[[remote_console.use.sensitive]]
verb = "deop"
title = "Retirer les droits d'opérateur à {joueur} ?"
sentence = "{joueur} ne pourra plus taper les commandes réservées aux opérateurs. Vous pourrez les lui redonner plus tard."
target = "first_arg"

[[remote_console.use.sensitive]]
verb = "ban"
title = "Bannir {joueur} ?"
sentence = "{joueur} ne pourra plus se connecter à ce serveur tant que vous ne l'aurez pas gracié. S'il est connecté, il est expulsé."
target = "first_arg"

[[remote_console.use.sensitive]]
verb = "ban-ip"
title = "Bannir cette adresse ?"
sentence = "Plus aucun joueur ne pourra se connecter depuis cette adresse, quel que soit son pseudo, tant que vous ne l'aurez pas graciée."
target = "none"

[[remote_console.use.sensitive]]
verb = "pardon"
title = "Gracier {joueur} ?"
sentence = "{joueur} pourra de nouveau se connecter à ce serveur."
target = "first_arg"

[[remote_console.use.sensitive]]
verb = "pardon-ip"
title = "Gracier cette adresse ?"
sentence = "Les joueurs de cette adresse pourront de nouveau se connecter à ce serveur."
target = "none"

[[remote_console.use.sensitive]]
verb = "kick"
title = "Expulser {joueur} ?"
sentence = "{joueur} est déconnecté tout de suite. Il peut se reconnecter aussitôt, sauf s'il est banni."
target = "first_arg"

[[remote_console.use.sensitive]]
verb = "whitelist"
title = "Changer la liste blanche ?"
sentence = "La liste blanche décide qui peut entrer sur le serveur quand elle est activée. Un mauvais réglage peut fermer la porte à tout le monde ou l'ouvrir à n'importe qui."
target = "none"

[[remote_console.use.sensitive]]
verb = "save-off"
title = "Arrêter l'enregistrement automatique ?"
sentence = "Tant que l'enregistrement n'est pas rallumé, le monde n'est plus écrit sur le disque : un arrêt brutal fait perdre tout ce qui s'est passé depuis. Pensez à taper save-on."
target = "none"

[[remote_console.use.sensitive]]
verb = "execute"
title = "Exécuter une commande composée ?"
sentence = "La commande execute peut lancer n'importe quelle autre commande à la place d'un joueur, d'un lieu ou d'une entité. Hearth ne peut pas savoir ce qu'elle fera."
target = "none"

[remote_console.use.players]
command = "list"
reader = "minecraft_list"

[[remote_console.use.quick]]
id = "save"
label = "Enregistrer le monde"
text = "save-all"
mode = "send"

[[remote_console.use.quick]]
id = "day"
label = "Mettre le jour"
text = "time set day"
mode = "send"

[[remote_console.use.quick]]
id = "say"
label = "Écrire un message à tous"
text = "say"
mode = "fill"

[remote_console.use.before_stop]
command = "save-all flush"
expect = "Saved the game"
timeout_s = 60

[[agreement]]
id = "eula"
title = "Contrat de licence de Minecraft (EULA)"
url = "https://www.minecraft.net/eula"
sentence = "J'ai lu le contrat de licence de Minecraft et je l'accepte."

[agreement.binds]
channel = "env"
key = "EULA"
accepted_value = "TRUE"

[mods]
ways = ["drop_pack", "drop_jars"]

[mods.pack]
folder = "packs"

# Les mods `.jar` d'un serveur installé (HRT-253, ADR-0062) : le jeu lit `/data/mods`, Hearth y pose et y renomme des
# fichiers (jamais de suppression) ; « Mods retirés » (`/data/mods-retires`) n'est jamais lu par le jeu. L'arrêt simple
# enregistre le monde (`by_image_on_signal`). Vanilla, Paper et Purpur ne prennent pas de mods `.jar` (BR-MOD-030).
[mods.jars]
folder = "data"
dir = "mods"
retired_dir = "mods-retires"
variants = ["fabric", "quilt", "forge", "neoforge", "modrinth"]

# Un pack serveur (`.zip`, `mods` et `config` à la racine) : `GENERIC_PACK`, avec un moteur à mods.
[[mods.pack.genre]]
kind = "server_pack"
env = "GENERIC_PACK"
variants = ["paper", "purpur", "fabric", "quilt", "forge", "neoforge"]

# Un pack Modrinth (`.mrpack`) : `MODRINTH_MODPACK`, le moteur vient du pack.
[[mods.pack.genre]]
kind = "modrinth_pack"
env = "MODRINTH_MODPACK"
variants = ["modrinth"]

[first_start]
ready_timeout_s = 3600                    # un gros pack (centaines de mods) se déballe, puis se charge : plusieurs minutes. Non mesuré.
world_generation = true

[[first_start.download]]
what = "Le serveur du jeu et le moteur choisi"
source_label = "Mojang et l'éditeur du moteur"
evidence = "unmeasured"

[ready]
log_contains = "For help, type"           # fin de la ligne « Done (…s)! For help, type "help" » de Minecraft ; vu par le banc d'essai réel (forge, 15/11/2026) : jeu officiel après 10 s, Fabric + Prominence II après 95 s
status = "tested"

# L'image intercepte le signal d'arrêt, envoie « stop » au jeu par sa console interne (le jeu enregistre le monde) et
# attend la fin du processus (`STOP_DURATION`). Le délai du moteur est plus long que cette attente. Vérifié par le banc
# d'essai réel (forge, 15/11/2026) : code de sortie 0, monde enregistré (`level.dat` réécrit), 0 s pour le jeu officiel et
# 3 s pour Fabric + Prominence II, bien avant le délai.
[stop]
grace_s = 210
signal = "SIGTERM"
world_saved = "by_image_on_signal"

[resources]
cpu = { evidence = "unmeasured" }
# Banc d'essai réel, forge, 15/11/2026, sans joueur : ce sont les LIMITES essayées, chacune démarre, répond, enregistre et
# s'arrête proprement. Jeu officiel (26.3) avec 2 Gio : 552 Mio au repos 60 s après le signe « prêt » (compteur du moteur,
# sans le cache de fichiers). Avec 4 Gio : 698 Mio. Fabric 1.20.1 + pack serveur Prominence II 4.1.8 avec 10 Gio : 7,6 Gio
# au repos, pic de 9,4 Go (décimal) au démarrage (cache de fichiers compris), signe « prêt » après 95 s. Un plancher plus bas n'a pas
# été essayé : il n'est pas affirmé.
memory = { min_bytes = 2147483648, recommended_bytes = 4294967296, evidence = "measured" }
# Jeu officiel : image (1 363 527 826 octets) + dossiers gérés après un premier démarrage. Avec le pack Prominence II :
# 5 248 719 852 octets (image Fabric, fichier du pack de 1,58 Go et son contenu ouvert).
disk = { install_bytes = 1497623985, evidence = "measured_idle" }

# Le cran « Ultra » est celui d'un gros pack de mods (essayé avec 10 Gio : Prominence II, 377 mods).
[[resources.memory_tier]]
id = "ultra"
from_bytes = 10737418240
evidence = "measured"

[[not_exposed]]
key = "OPS"
channel = "env"
why = "Les opérateurs se nomment par leur compte Minecraft : Hearth ne garde aucun identifiant de compte (BR-FICHE-011). Le fichier des opérateurs se modifie dans l'onglet Fichiers."

[[not_exposed]]
key = "WHITELIST"
channel = "env"
why = "Seul le réglage « liste blanche » (ENABLE_WHITELIST) est exposé. Les joueurs se nomment par leur compte Minecraft : Hearth ne garde aucun identifiant de compte (BR-FICHE-011). Le fichier de la liste blanche se modifie dans l'onglet Fichiers."
