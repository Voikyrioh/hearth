# Réglages de 7 Days to Die : thèmes et catalogue (HRT-115, HRT-226). Tous les réglages du `serverconfig.xml` livré avec la version
# stable installée le 16/11/2026 (l'image `vinanrra/7dtd-server`, serveur téléchargé par SteamCMD) sont classés : réglables, imposés avec leur
# raison, ou écartés avec leur raison (`[[not_exposed]]` de la fiche). Les défauts sont ceux LUS dans ce fichier (`source = "verified"`).
# Libellés et aides : vouvoiement, mots simples.

[[theme]]
id = "game"
label = "Ma partie"
order = 1

[[theme]]
id = "players"
label = "Joueurs"
order = 2

[[theme]]
id = "world"
label = "Monde"
order = 3

[[theme]]
id = "rules"
label = "Règles de jeu"
order = 4

[[theme]]
id = "claims"
label = "Territoires"
order = 5

[[theme]]
id = "performance"
label = "Performances"
order = 6

[[theme]]
id = "network"
label = "Réseau"
order = 7

[[theme]]
id = "security"
label = "Sécurité"
order = 8

[[setting]]
id = "server_name"
key = "ServerName"
channel = "config"
theme = "game"
level = "essential"
label = "Nom du serveur"
help = "Le nom que vos joueurs voient dans la liste des serveurs."
type = "text"
charset = "line"
max_len = 100
game_default = "My Game Host"
proposed = "Mon serveur 7 Days to Die"
change = "anytime"
source = "verified"

[[setting]]
id = "server_description"
key = "ServerDescription"
channel = "config"
theme = "game"
level = "common"
label = "Description"
help = "Le texte qui accompagne le nom du serveur dans la liste."
type = "text"
charset = "line"
max_len = 200
game_default = "A 7 Days to Die server"
change = "anytime"
source = "verified"

[[setting]]
id = "server_website"
key = "ServerWebsiteURL"
channel = "config"
theme = "game"
level = "advanced"
