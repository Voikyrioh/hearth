choices = [
  { value = "0", label = "Tout montrer" },
  { value = "1", label = "Cacher à la console du serveur" },
  { value = "2", label = "Cacher aussi aux joueurs" },
  { value = "3", label = "Tout cacher" },
]
game_default = "0"
change = "anytime"
source = "verified"

[[setting]]
id = "server_port"
key = "ServerPort"
channel = "config"
theme = "network"
level = "advanced"
label = "Port du jeu"
help = "Le port sur lequel le jeu écoute dans le service. Il suit le port choisi dans « Modifier » : vous ne pouvez pas le changer ici."
type = "int"
min = 1024
max = 65535
game_default = "26900"
change = "anytime"
imposed = { port = "game", why = "Le jeu annonce son port : il suit celui que Hearth relie au service." }
source = "verified"

[[setting]]
id = "game_mode"
key = "GameMode"
channel = "config"
theme = "world"
level = "advanced"
label = "Mode de jeu"
help = "Le seul mode que le serveur propose : la survie. Vous ne pouvez pas le changer."
type = "text"
charset = "line"
max_len = 40
game_default = "GameModeSurvival"
change = "anytime"
imposed = { value = "GameModeSurvival", why = "La documentation du fichier ne liste que ce mode." }
source = "verified"

[[setting]]
id = "telnet_enabled"
key = "TelnetEnabled"
channel = "config"
theme = "network"
level = "advanced"
label = "Console distante"
help = "La console distante sert à arrêter proprement le jeu. Elle reste active et n'est jamais publiée : vous ne pouvez pas la changer."
type = "bool"
on = "true"
off = "false"
game_default = "true"
change = "anytime"
imposed = { value = "true", why = "L'arrêt propre du jeu passe par cette console (l'image envoie l'ordre d'arrêt par elle)." }
source = "verified"

[[setting]]
id = "telnet_port"
key = "TelnetPort"
channel = "config"
theme = "network"
level = "advanced"
label = "Port de la console distante"
help = "Le port de la console, à l'intérieur du service. Il n'est jamais publié : vous ne pouvez pas le changer."
type = "int"
min = 1024
max = 65535
game_default = "8081"
change = "anytime"
imposed = { port = "telnet", why = "L'image et la fiche attendent la console sur ce port, jamais publié." }
source = "verified"

[[setting]]
id = "telnet_password"
key = "TelnetPassword"
channel = "config"
theme = "network"
level = "advanced"
label = "Mot de passe de la console"
help = "Tiré par Hearth à l'installation. Il n'est jamais affiché et vous ne pouvez pas le changer."
type = "secret"
max_len = 100
secret_kind = "admin_password"
game_default = ""
change = "anytime"
imposed = { secret = "telnet", why = "L'arrêt propre en dépend : Hearth le tire et le garde." }
source = "verified"

[[setting]]
id = "terminal_window"
key = "TerminalWindowEnabled"
channel = "config"
theme = "network"
level = "advanced"
label = "Fenêtre de terminal"
help = "Une fenêtre de terminal n'existe pas dans un service : ce réglage reste désactivé."
type = "bool"
on = "true"
off = "false"
game_default = "true"
change = "anytime"
imposed = { value = "false", why = "Réglage de Windows : sans effet dans un service." }
source = "verified"

[[setting]]
id = "web_dashboard"
key = "WebDashboardEnabled"
channel = "config"
theme = "network"
level = "advanced"
label = "Tableau de bord web"
help = "Le tableau de bord web n'est pas publié par Hearth : ce réglage reste désactivé."
type = "bool"
on = "true"
off = "false"
game_default = "false"
change = "anytime"
imposed = { value = "false", why = "Son port n'est pas publié ; le service n'en a pas besoin." }
source = "verified"
