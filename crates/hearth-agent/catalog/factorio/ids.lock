# Un identifiant publié ne disparaît pas par oubli : retiré de la fiche, il passe en [[retired]] avec sa raison,
# et son état ici devient `retired` (avec `retired_in`). `cargo xtask catalog-check` le vérifie.

ids = [
  { id = "save_name", key = "SAVE_NAME", channel = "env", state = "active", since = 1 },
  { id = "preset", key = "PRESET", channel = "env", state = "active", since = 1 },
  { id = "space_age", key = "DLC_SPACE_AGE", channel = "env", state = "active", since = 1 },
  { id = "port", key = "PORT", channel = "env", state = "active", since = 1 },
]
