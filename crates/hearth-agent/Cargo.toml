[package]
name = "hearth-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "hearth_agent"
path = "src/lib.rs"

[[bin]]
name = "hearth-agent"
path = "src/main.rs"

[dependencies]
hearth-proto.workspace = true
axum.workspace = true
argon2.workspace = true
async-trait.workspace = true
base64.workspace = true
bollard.workspace = true
axum-server.workspace = true
clap.workspace = true
flate2.workspace = true
futures-util.workspace = true
getrandom.workspace = true
gethostname.workspace = true
http-body-util.workspace = true
mac_address.workspace = true
minisign-verify.workspace = true
url.workspace = true
reqwest.workspace = true
rcgen.workspace = true
ring.workspace = true
rpassword.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
sha2.workspace = true
subtle.workspace = true
sysinfo.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tower-http.workspace = true
toml.workspace = true
unicode-normalization.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-log.workspace = true
ulid.workspace = true
zeroize.workspace = true

# Les seules constantes d'ouverture de fichier (`O_NOFOLLOW`, `O_NONBLOCK`, `ELOOP`) de `services.key` ;
# déjà dans l'arbre (tokio, mio), aucun `unsafe` (lint `forbid`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Extraction d'archive (HRT-130) : `openat` + `O_NOFOLLOW` par composant, API sûre (le lint `forbid(unsafe_code)` tient).
rustix.workspace = true

# `build.rs` applique le chargeur de fiches (HRT-113) : même code que l'agent, déjà dans l'arbre de dépendances.
[build-dependencies]
serde.workspace = true
sha2.workspace = true
toml.workspace = true

[dev-dependencies]
log.workspace = true
minisign.workspace = true
tempfile.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
tower.workspace = true
# TLS 1.2 n'est activé que pour vérifier que l'agent le refuse.
rustls = { workspace = true, features = ["tls12"] }
