name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # La coquille Tauri est vérifiée par le job `desktop` (Windows, WebView2) : pas de bibliothèques système sous Linux.
      - run: cargo clippy --workspace --exclude hearth-desktop --all-targets -- -D warnings
      - run: cargo test --workspace --exclude hearth-desktop

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Interface (installation, Biome, types, Vitest, build)
        working-directory: apps/desktop
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
      # Interface servie par Vite avec le pont de liaison simulé, dans Chromium (captures 1366/1920/2560).
      - name: Scénarios navigateur (Playwright)
        working-directory: apps/desktop
        run: |
          npx playwright install chromium
          npm run e2e
      - uses: actions/upload-artifact@v4
        with:
          name: hearth-ui-screenshots
          path: apps/desktop/e2e/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Coquille Tauri (clippy, tests)
        run: |
          cargo clippy -p hearth-desktop --all-targets -- -D warnings
          cargo test -p hearth-desktop
      # Le livrable du ticket : l'installateur doit se construire à chaque PR.
      - name: Installateur NSIS
        working-directory: apps/desktop
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: hearth-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
