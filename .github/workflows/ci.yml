name: ci

on:
  pull_request:
  push:
    branches: [main]
  # La version longue du débit des journaux (HRT-66) : job `engine-logs-long`, 10 minutes par défaut.
  workflow_dispatch:
    inputs:
      log_rate_seconds:
        description: "Durée du débit soutenu des journaux, en secondes (version longue)"
        default: "600"

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  # Une PR annule son exécution précédente ; hors PR, un groupe par exécution : chaque push sur `main` va jusqu'au bout.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Détection des chemins touchés (ADR-0058). Les deux jobs Windows (facturés à la minute, tarif x2) sont des
  # contrôles REQUIS de la branche : ils ne peuvent pas être sautés par `if:` de job (un job sauté ne rapporte
  # pas toujours son nom de matrice : la PR resterait « Expected »). Ils tournent donc toujours, mais sur
  # `ubuntu-latest` avec toutes leurs étapes ignorées quand rien de leur périmètre n'a changé : succès en
  # quelques secondes. `windows=true` : push, lancement manuel, ou fichier du périmètre client Windows.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      windows: ${{ steps.scope.outputs.windows }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "windows=true" >> "$GITHUB_OUTPUT"; echo "Hors PR : Windows complet"; exit 0; fi
          # En cas d'échec de la liste, on lance Windows (jamais un contrôle sauté par erreur).
          files="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')" || { echo "windows=true" >> "$GITHUB_OUTPUT"; echo "Liste des fichiers illisible : Windows complet"; exit 0; }
          echo "$files"
          # Périmètre client Windows : coquille et interface, bibliothèques partagées avec l'agent (proto) ou
          # propres au client (link), outils de construction, verrou et chaîne d'outils, ce workflow et ses actions.
          if grep -Eq '^(apps/desktop/|crates/hearth-link/|crates/hearth-proto/|crates/hearth-agent/tests/support/|xtask/|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|clippy\.toml$|\.cargo/|\.github/workflows/ci\.yml$|\.github/actions/)' <<<"$files"; then
            echo "windows=true" >> "$GITHUB_OUTPUT"
          else
            echo "windows=false" >> "$GITHUB_OUTPUT"; echo "Rien du périmètre Windows : jobs Windows ignorés"
          fi

  rust:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # Jambe Windows sans changement du périmètre : exécutée sur Linux, étapes ignorées (voir `changes`).
    runs-on: ${{ (matrix.os == 'windows-latest' && needs.changes.outputs.windows != 'true') && 'ubuntu-latest' || matrix.os }}
    env:
      RUN: ${{ matrix.os != 'windows-latest' || needs.changes.outputs.windows == 'true' }}
    steps:
      - if: env.RUN != 'true'
        run: echo "::notice::Jambe Windows ignorée, aucun fichier du périmètre client Windows (ADR-0058)"
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.95"
          components: rustfmt, clippy
      - if: env.RUN == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - if: env.RUN == 'true'
        run: cargo fmt --all -- --check
      # Toute référence BR-… du code et des docs a sa fiche dans docs/business-rules.
      - if: env.RUN == 'true'
        run: cargo xtask br-check
      # Numéros de version concordants (Cargo.toml, Cargo.lock, package.json, package-lock.json, aucun dans
      # tauri.conf.json) et clés publiques de production (HRT-172, BR-RELEASE-006). Sans réseau ni secret.
      - if: env.RUN == 'true'
        run: cargo xtask release-preflight --versions-only
      # Fiches de serveur de jeu embarquées (HRT-113) : chargeur réel + registre ids.lock.
      # La branche principale sert de référence au registre ids.lock (un identifiant retiré ne disparaît pas).
      - if: env.RUN == 'true'
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
        continue-on-error: true
      - if: env.RUN == 'true'
        run: cargo xtask catalog-check
      # La coquille Tauri est vérifiée par le job `desktop` (Windows, WebView2) : pas de bibliothèques système sous Linux.
      - if: env.RUN == 'true'
        run: cargo clippy --workspace --exclude hearth-desktop --all-targets -- -D warnings
      - if: env.RUN == 'true'
        run: cargo test --workspace --exclude hearth-desktop
      # HRT-145 (ADR-0046) : les pièges réservés à root (périphérique planté par un service root, propriétaire
      # donné à un autre compte) ne se jouent qu'en root. Le binaire de tests de la bibliothèque, déjà
      # construit, est relancé sous sudo sur les seuls tests de `infrastructure/fs`.
      - name: Fichiers d'un service, en root
        if: env.RUN == 'true' && (runner.os == 'Linux')
        run: |
          bin="$(cargo test -p hearth-agent --lib --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "hearth_agent" and .profile.test == true and .executable != null) | .executable' \
            | tail -n 1)"
          test -x "$bin"
          out="$(sudo -E env "PATH=$PATH" "$bin" infrastructure::fs::tests_unix --test-threads=2 2>&1)" || { echo "$out"; exit 1; }
          echo "$out"
          # Un filtre qui ne trouve plus rien ne doit pas passer pour un succès.
          echo "$out" | grep -Eq 'test result: ok\. [1-9][0-9]* passed'
      # Garde-fou des dossiers temporaires (HRT-18, T43) : les tests les créent sous
      # target/hearth-test-tmp (et /dev/shm/hearth-test-tmp) et les suppriment ; s'il en reste, un test
      # garde un fichier ouvert ou ne nettoie pas, et la suite échoue ici plutôt que de remplir un disque.
      - if: env.RUN == 'true'
        run: cargo xtask test-tmp-check --expect-tests

  desktop:
    needs: changes
    # Sans changement du périmètre : Linux, étapes ignorées (voir `changes`).
    runs-on: ${{ needs.changes.outputs.windows == 'true' && 'windows-latest' || 'ubuntu-latest' }}
    env:
      RUN: ${{ needs.changes.outputs.windows == 'true' }}
    steps:
      - if: env.RUN != 'true'
        run: echo "::notice::Job desktop ignoré, aucun fichier du périmètre client Windows (ADR-0058)"
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.RUN == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.95"
          components: clippy
      - if: env.RUN == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # bash (et non pwsh, défaut de Windows) : sous pwsh, un `run: |` multi-lignes ne garde que le code de sortie
      # de la DERNIÈRE commande, un lint ou un clippy en échec passait inaperçu (HRT-84).
      - if: env.RUN == 'true'
        name: Interface (installation, Biome, types, Vitest, build)
        working-directory: apps/desktop
        shell: bash
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm run check:dist
      # Interface servie par Vite avec le pont simulé (captures 1366/1920/2560) ET build livré servi en statique (pont vide).
      - if: env.RUN == 'true'
        name: Scénarios navigateur (Playwright)
        working-directory: apps/desktop
        shell: bash
        run: |
          npx playwright install chromium
          npm run e2e
      # À l'échec d'un scénario : la trace (rejouable : `npx playwright show-trace`), l'état de la page
      # (`error-context.md`), la capture et la vidéo si elles existent (HRT-18 : `audit.spec.ts:141`,
      # cause encore inconnue, ne se voit qu'avec cela).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.RUN == 'true' && (failure())
        with:
          name: hearth-playwright-failure
          path: apps/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - if: env.RUN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hearth-ui-screenshots
          path: apps/desktop/e2e/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
      - if: env.RUN == 'true'
        name: Coquille Tauri (clippy, tests)
        shell: bash
        run: |
          cargo clippy -p hearth-desktop --all-targets -- -D warnings
          cargo test -p hearth-desktop
      # Garde-fou des dossiers temporaires (HRT-18, T43), voir le job `rust`.
      - if: env.RUN == 'true'
        name: Dossiers temporaires laissés par les tests
        run: cargo xtask test-tmp-check --expect-tests
      # Le coffre réel : le Gestionnaire d'identification de ce Windows jetable (clé exacte `Hearth/{id}`,
      # secret absent, remplacement, effacement). Marqué `ignore` pour ne pas écrire dans la session
      # d'un poste de développement par défaut.
      - if: env.RUN == 'true'
        name: Coffre Windows (Gestionnaire d'identification)
        run: cargo test -p hearth-desktop --test vault -- --ignored
      # Le vrai registre de ce Windows jetable (HRT-29) : valeur absente, écriture exacte, relecture,
      # retrait, type inattendu, sur une sous-clé jetable de HKCU (jamais la vraie clé `Run`). Marqué
      # `ignore` : il écrit dans le registre de l'utilisateur qui le lance.
      - if: env.RUN == 'true'
        name: Entrée de démarrage (vrai registre, sous-clé jetable)
        run: cargo test -p hearth-desktop --test windows_registry -- --ignored
      # Le livrable du ticket : l'installateur doit se construire à chaque PR.
      - if: env.RUN == 'true'
        name: Installateur NSIS
        working-directory: apps/desktop
        run: npm run tauri build
      - if: env.RUN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hearth-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
      # La preuve en vrai (HRT-21, BR-CLIENT-006) : l'installateur compilé est EXECUTE ici, sur le
      # runner jetable (jamais sur un poste) : page d'accueil capturée, case cochée/décochée,
      # installation silencieuse (/S), réinstallation et mise à jour passive (/UPDATE /P) qui
      # ne touchent pas à l'entrée de démarrage, désinstallation. Installateur non signé, publié
      # nulle part ailleurs que dans les artefacts de ce run.
      - if: env.RUN == 'true'
        name: Installateur NSIS (exécution sur le runner jetable)
        shell: pwsh
        timeout-minutes: 15
        run: ./apps/desktop/scripts/installer-ci.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.RUN == 'true' && (always())
        with:
          name: hearth-installer-evidence
          path: installer-evidence/
          if-no-files-found: ignore
          retention-days: 7

  # Le vrai moteur de conteneurs (HRT-61, ADR-0036). Les runners `ubuntu-latest` ont Docker : la suite de
  # contrat du port `ContainerEngine` (liste, inspection, événements, lecture d'un conteneur supprimé)
  # s'y exécute contre le VRAI moteur, par `bollard` sur le socket Unix. C'est ce qui empêche le faux
  # moteur et le faux démon HTTP des tests de mentir. Job indépendant : aucun autre job n'en dépend,
  # il ne peut pas casser les quatre autres. Images minuscules (`busybox`, miroir public de Docker Hub
  # chez AWS : sa limite anonyme existe pourtant, d'où le cache de l'image et le repli ci-dessous, HRT-168). Ce job n'a jamais été exécuté avant sa première PR.
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HEARTH_TEST_ENGINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Moteur du runner (version)
        run: docker version
      # HRT-168 : images des tests fixées par empreinte (busybox:1.36 + un registre local), d'abord du cache
      # de la CI, sinon ECR puis Docker Hub ; cache sauvé tout de suite, même si le job finit rouge. Le
      # moteur récupère l'image du contrat chez ce registre local (`HEARTH_TEST_PULL_REPO`) : aucun quota
      # public pendant la suite. Un registre KO sort en `REGISTRE ...`, jamais comme un test en échec.
      # Détail : `.github/actions/test-image` et `.github/scripts/test-image.sh`.
      - name: Images des tests (cache, ECR, Docker Hub, registre local)
        uses: ./.github/actions/test-image
      # La suite de contrat (liste, inspection, événements, journaux : fin, dernières lignes, reprise, suivi,
      # terminal, ligne géante, pilote `none` ; HRT-64 : démarrer, arrêter dans le délai et de force avec le
      # code 137, redémarrer, un port pris, un conteneur inconnu, l'arrêt d'un conteneur `--rm` ; HRT-68 :
      # récupérer une image avec sa progression, l'abandonner, les échecs d'image typés, créer depuis le plan fermé
      # avec ses étiquettes, ses limites et `unless-stopped`, le nom pris, le port pris, supprimer) et le débit
      # soutenu des journaux : 60 s à environ 1 000 lignes
      # par seconde, sans perte ni doublon, mémoire du lecteur stable (HRT-66).
      - name: Suite de contrat de l'adaptateur contre un vrai moteur
        env:
          HEARTH_LOG_RATE_SECONDS: "60"
          HEARTH_TEST_PULL_REPO: localhost:5000
        run: cargo test -p hearth-agent --test engine_real -- --ignored --test-threads=1 --nocapture
      # HRT-168 : la suite de contrat n'interroge plus le registre public, donc ses textes d'erreur
      # (`pull access denied`, `repository does not exist`, `manifest unknown`, reconnus par `translate_pull`)
      # y sont confirmés ICI, hors du chemin bloquant : un quota ou une panne du registre ne fait pas échouer le job.
      - name: Textes d'erreur du registre public (non bloquant)
        continue-on-error: true
        run: |
          out="$(docker pull public.ecr.aws/docker/library/hearth-contract-nope:1 2>&1 || true)"; echo "$out"
          if printf '%s' "$out" | grep -Eiq 'toomanyrequests|rate exceeded|data limit exceeded'; then echo "::notice::registre public limité : textes d'erreur non confirmés cette fois"; exit 0; fi
          printf '%s' "$out" | grep -Eiq 'pull access denied|repository does not exist' || { echo "::warning::texte inattendu (nom inconnu) : mettre à jour la table de translate_pull"; exit 1; }
          out="$(docker pull public.ecr.aws/docker/library/busybox:hearth-no-such-tag 2>&1 || true)"; echo "$out"
          if printf '%s' "$out" | grep -Eiq 'toomanyrequests|rate exceeded|data limit exceeded'; then echo "::notice::registre public limité : textes d'erreur non confirmés cette fois"; exit 0; fi
          printf '%s' "$out" | grep -Eiq 'manifest unknown|not found' || { echo "::warning::texte inattendu (version inconnue) : mettre à jour la table de translate_pull"; exit 1; }
      # HRT-68 (BR-DEPLOY-021) : un service créé par Hearth (`unless-stopped`) revient quand le démon du runner
      # redémarre (`sudo systemctl restart docker`), sauf celui qu'on a arrêté à la main.
      - name: Un service créé par Hearth revient après le redémarrage du démon
        env:
          HEARTH_TEST_DAEMON_RESTART: "1"
        run: cargo test -p hearth-agent --test engine_real an_unless_stopped_service_comes_back -- --ignored --test-threads=1 --nocapture
      # Rien ne doit rester : les conteneurs de test sont supprimés avant et après la suite.
      - name: Conteneurs laissés par la suite
        if: always()
        run: |
          left="$(docker ps -aq --filter name=hearth-contract-)"
          if [ -n "$left" ]; then docker ps -a --filter name=hearth-contract-; docker rm -f $left; exit 1; fi
      # HRT-63 (ADR-0037) : un conteneur lancé par une unité systemd (`systemd-run --unit=hearth-e2e
      # --property=Restart=always docker run --rm --name hearth-e2e ...`, root). Le test détecte le
      # propriétaire par /proc, lit l'unité, vérifie la clé `u_` du service, et CONSIGNE ce que fait un
      # arrêt par l'API du moteur sur ce conteneur (question ouverte de la section 0 de la conception) :
      # la réponse est dans le journal de l'étape et dans le résumé du job. Il ne la juge pas. Il
      # consigne aussi l'arrêt PAR LE SUPERVISEUR (durée, état de l'unité, conteneur, registre) d'une
      # unité transitoire et d'une unité de fichier, puis juge. HRT-64 (ADR-0037) : les trois ordres du
      # superviseur (arrêter, démarrer, redémarrer, `systemctl`) sur une unité de fichier qui se relance
      # toujours : l'arrêt TIENT, le démarrage recrée le conteneur, le redémarrage le remplace. Pire cas des
      # attentes : environ 13 minutes (3 x 60 s de démarrage, 30 s, 2 x (60 s + 30 s) pour le premier test ;
      # 60 s, 50 s, 6 s, 2 x 60 s pour le second, hors téléchargement) ; l'étape est coupée à 16 minutes, le
      # job à 25.
      - name: Service supervisé par une unité systemd (propriétaire détecté, arrêts consignés, trois ordres)
        timeout-minutes: 16
        run: |
          bin="$(cargo test -p hearth-agent --test engine_supervised --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "engine_supervised" and .executable != null) | .executable' \
            | tail -n 1)"
          test -x "$bin"
          sudo -E env "PATH=$PATH" HEARTH_TEST_SUPERVISED=1 "$bin" --ignored --test-threads=1 --nocapture
      - name: Unités et conteneurs laissés par l'étape supervisée
        if: always()
        run: |
          left="$(docker ps -aq --filter name=hearth-e2e)"
          units="$(systemctl list-units --all --plain --no-legend 'hearth-e2e*' || true)"
          if [ -n "$left" ] || [ -n "$units" ]; then
            docker ps -a --filter name=hearth-e2e; echo "$units"
            sudo systemctl stop 'hearth-e2e*' || true; sudo rm -f /run/systemd/system/hearth-e2e-file.service /run/systemd/system/hearth-e2e-drive.service
            [ -z "$left" ] || docker rm -f $left
            exit 1
          fi

  # La version longue du débit des journaux (HRT-66) : lancée à la main (`workflow_dispatch`), pas à chaque
  # PR. Un service qui écrit environ 1 000 lignes par seconde est lu sans perte pendant 10 minutes
  # (durée réglable à la main) ; la mémoire du lecteur est mesurée avant et après.
  engine-logs-long:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEARTH_TEST_ENGINE: "1"
      HEARTH_LOG_RATE_SECONDS: ${{ inputs.log_rate_seconds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # HRT-168 : images des tests fixées par empreinte (busybox:1.36 + un registre local), d'abord du cache
      # de la CI, sinon ECR puis Docker Hub ; cache sauvé tout de suite, même si le job finit rouge. Le
      # moteur récupère l'image du contrat chez ce registre local (`HEARTH_TEST_PULL_REPO`) : aucun quota
      # public pendant la suite. Un registre KO sort en `REGISTRE ...`, jamais comme un test en échec.
      # Détail : `.github/actions/test-image` et `.github/scripts/test-image.sh`.
      - name: Images des tests (cache, ECR, Docker Hub, registre local)
        uses: ./.github/actions/test-image
      - name: Débit soutenu des journaux (version longue)
        run: cargo test -p hearth-agent --test engine_real a_service_writing_a_thousand_lines_a_second -- --ignored --test-threads=1 --nocapture
      - name: Conteneurs laissés par le test
        if: always()
        run: |
          left="$(docker ps -aq --filter name=hearth-contract-)"
          if [ -n "$left" ]; then docker rm -f $left; exit 1; fi

  # Le binaire de l'agent (statique, musl), l'installation de bout en bout dans un conteneur avec
  # systemd, et les scripts de deploy/. Les conteneurs sont ceux de `cargo xtask` ; leur cache
  # (registre Cargo et dossier de cibles) est un dossier de l'hôte, mis en cache d'une exécution
  # à l'autre.
  agent-install:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HEARTH_XTASK_CACHE: ${{ github.workspace }}/.xtask-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .xtask-cache
          key: xtask-agent-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: xtask-agent-${{ runner.os }}-
      - name: Scripts de deploy/ (shellcheck)
        run: cargo xtask shellcheck
      - name: Binaire statique de l'agent (musl)
        run: cargo xtask agent
      - name: Installation de bout en bout (Debian + systemd)
        run: cargo xtask e2e-install
      - name: Mise à jour de l'agent à distance de bout en bout (Debian + systemd, clé jetable)
        run: cargo xtask e2e-update
      # La double panne de la mise à jour (HRT-27) sur le systemd jetable, avec le binaire construit
      # ci-dessus : superviseur tué puis relancé, arrêt voulu jamais défait, reprises bornées, agent
      # redémarré pendant l'attente de relance. Les `ok - …` de chaque section sont dans le journal.
      - name: Double panne de la mise à jour de l'agent (Debian + systemd)
        run: cargo xtask e2e-double-failure
      - name: Somme SHA-256 du binaire
        run: sha256sum hearth-agent > hearth-agent.sha256 && cat hearth-agent.sha256
        working-directory: target/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hearth-agent-linux-x86_64
          path: |
            target/dist/hearth-agent
            target/dist/hearth-agent.sha256
          if-no-files-found: error
          retention-days: 7
      # Le conteneur écrit le cache en root : rendu à l'utilisateur pour que la sauvegarde le lise.
      - name: Droits du cache
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .xtask-cache || true
