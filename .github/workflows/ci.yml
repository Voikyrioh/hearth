name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.95"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      # Toute référence BR-… du code et des docs a sa fiche dans docs/business-rules.
      - run: cargo xtask br-check
      # La coquille Tauri est vérifiée par le job `desktop` (Windows, WebView2) : pas de bibliothèques système sous Linux.
      - run: cargo clippy --workspace --exclude hearth-desktop --all-targets -- -D warnings
      - run: cargo test --workspace --exclude hearth-desktop

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.95"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Interface (installation, Biome, types, Vitest, build)
        working-directory: apps/desktop
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm run check:dist
      # Interface servie par Vite avec le pont simulé (captures 1366/1920/2560) ET build livré servi en statique (pont vide).
      - name: Scénarios navigateur (Playwright)
        working-directory: apps/desktop
        run: |
          npx playwright install chromium
          npm run e2e
      - uses: actions/upload-artifact@v4
        with:
          name: hearth-ui-screenshots
          path: apps/desktop/e2e/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Coquille Tauri (clippy, tests)
        run: |
          cargo clippy -p hearth-desktop --all-targets -- -D warnings
          cargo test -p hearth-desktop
      # Le coffre réel : le Gestionnaire d'identification de ce Windows jetable (clé exacte `Hearth/{id}`,
      # secret absent, remplacement, effacement). Marqué `ignore` pour ne pas écrire dans la session
      # d'un poste de développement par défaut.
      - name: Coffre Windows (Gestionnaire d'identification)
        run: cargo test -p hearth-desktop --test vault -- --ignored
      # Le livrable du ticket : l'installateur doit se construire à chaque PR.
      - name: Installateur NSIS
        working-directory: apps/desktop
        run: npm run tauri build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hearth-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
      # La preuve en vrai (HRT-21, BR-CLIENT-006) : l'installateur compilé est EXECUTE ici, sur le
      # runner jetable (jamais sur un poste) : page d'accueil capturée, case cochée/décochée,
      # installation silencieuse (/S), réinstallation et mise à jour passive (/UPDATE /P) qui
      # ne touchent pas à l'entrée de démarrage, désinstallation. Installateur non signé, publié
      # nulle part ailleurs que dans les artefacts de ce run.
      - name: Installateur NSIS (exécution sur le runner jetable)
        shell: pwsh
        timeout-minutes: 15
        run: ./apps/desktop/scripts/installer-ci.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: hearth-installer-evidence
          path: installer-evidence/
          if-no-files-found: ignore
          retention-days: 7

  # Le binaire de l'agent (statique, musl), l'installation de bout en bout dans un conteneur avec
  # systemd, et les scripts de deploy/. Les conteneurs sont ceux de `cargo xtask` ; leur cache
  # (registre Cargo et dossier de cibles) est un dossier de l'hôte, mis en cache d'une exécution
  # à l'autre.
  agent-install:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HEARTH_XTASK_CACHE: ${{ github.workspace }}/.xtask-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .xtask-cache
          key: xtask-agent-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: xtask-agent-${{ runner.os }}-
      - name: Scripts de deploy/ (shellcheck)
        run: cargo xtask shellcheck
      - name: Binaire statique de l'agent (musl)
        run: cargo xtask agent
      - name: Installation de bout en bout (Debian + systemd)
        run: cargo xtask e2e-install
      - name: Mise à jour de l'agent à distance de bout en bout (Debian + systemd, clé jetable)
        run: cargo xtask e2e-update
      - name: Somme SHA-256 du binaire
        run: sha256sum hearth-agent > hearth-agent.sha256 && cat hearth-agent.sha256
        working-directory: target/dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hearth-agent-linux-x86_64
          path: |
            target/dist/hearth-agent
            target/dist/hearth-agent.sha256
          if-no-files-found: error
          retention-days: 7
      # Le conteneur écrit le cache en root : rendu à l'utilisateur pour que la sauvegarde le lise.
      - name: Droits du cache
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .xtask-cache || true
