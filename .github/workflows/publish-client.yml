name: publish-client

# Publication du client Windows (HRT-16, HRT-52, ADR-0017, runbook docs/runbooks/publier-une-version-du-client.md).
#
# DÉCLENCHÉ À LA MAIN SEULEMENT (Actions, « Run workflow »), et seulement depuis `main` : aucun push, aucune
# PR, aucune étiquette ne le lance. Il construit l'installateur NSIS (job `build`, SANS aucun secret), puis
# le signe avec la clé SECRÈTE de l'environnement `release` (job `sign`, SANS installation de dépendances
# npm) et rend l'artefact `hearth-client-signed` (1 jour). Il ne dépose RIEN et ne crée AUCUNE release
# GitHub : les binaires vivent sur le bucket derrière https://hearth.voikyrioh.fr (conception distribution
# Scaleway, sections 4.6 et 8.2). La suite se fait sur la machine du propriétaire : `gh run download`, puis
# `cargo xtask release-stage` et `release-upload` (HRT-51). La release GitHub SANS binaire (étiquette,
# notes, `SHA256SUMS`) est créée à la main APRÈS le dépôt : voir le runbook.
#
# Contenu de l'artefact `hearth-client-signed` : Hearth_X.Y.Z_x64-setup.exe, son `.sig`, `latest.json` (adresse
# de l'installateur sur hearth.voikyrioh.fr ; intermédiaire, jamais déposé tel quel : le manifeste du bucket est
# écrit par `release-stage`, HRT-51) et `notes.txt` (notes saisies au lancement).
#
# ATTENTION : le dépôt est public, donc cet artefact (installateur SIGNÉ) se télécharge avec n'importe quel
# compte GitHub connecté dès la fin du job `sign`, jusqu'à sa suppression. Conservation : 1 jour. Le propriétaire
# le supprime sitôt téléchargé (runbook). Le numéro est brûlé dès que `sign` a réussi.
#
# La version publiée est celle de `Cargo.toml` (`cargo xtask client-version`) : rien n'est saisi à la main
# dans le formulaire, donc le numéro signé est celui du binaire construit.
#
# Secrets à créer avant la première exécution, comme secrets de l'ENVIRONNEMENT `release` (jamais dans un
# fichier du dépôt) :
#   HEARTH_CLIENT_SIGNING_KEY            contenu du fichier de clé secrète (`tauri signer generate`)
#   HEARTH_CLIENT_SIGNING_KEY_PASSWORD   son mot de passe (obligatoire)
# Et la clé PUBLIQUE correspondante dans apps/desktop/src-tauri/update-key.pub, commitée AVANT : le
# contrôle `client-release-check` refuse la clé de développement du dépôt, et `client-sign` refuse une
# clé secrète qui n'est pas la paire de ce fichier.
#
# Ce que la garde `main` NE ferme PAS : elle arrête une erreur, pas quelqu'un qui a l'écriture (le
# formulaire choisit la branche, donc le fichier de flux de cette branche, garde retirée comprise). Seul
# l'environnement GitHub `release` ferme cela : le job `sign` le DÉCLARE, et le détenteur du dépôt doit
# le créer AVANT la première exécution, avec approbation obligatoire et restriction à la branche `main`,
# et y ranger les deux secrets (secrets d'ENVIRONNEMENT, pas de dépôt). Voir le runbook.
# Sans cet environnement protégé, GitHub en crée un sans protection à la première exécution.

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Notes de version (texte brut, affiché tel quel dans le client)"
        required: true
        type: string

permissions:
  contents: read

# Deux lancements rapprochés signeraient deux fois le même numéro : un seul à la fois, sans annulation.
concurrency:
  group: publish-client
  cancel-in-progress: false

jobs:
  build:
    # Seulement depuis la branche principale : le binaire signé doit venir de ce qui est fusionné.
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # Garde de publication : la clé publique du dépôt n'est pas celle de développement, les versions de
      # Cargo.toml et de package.json sont les mêmes. Avant toute fabrication.
      - name: Garde de publication
        shell: bash
        run: cargo xtask client-release-check

      - name: Version du dépôt
        id: version
        shell: bash
        run: echo "version=$(cargo xtask client-version)" >> "$GITHUB_OUTPUT"

      # HRT-173 : l'arbre doit être le commit avant la construction (refus sinon), puis l'enregistrement
      # de construction de l'installateur (`.build`) est écrit après, lu par `release-stage`.
      - name: Relevé de l'arbre avant la construction
        shell: bash
        run: cargo xtask client-record --begin

      - name: Installateur NSIS
        working-directory: apps/desktop
        shell: bash
        run: |
          npm ci
          npm run tauri build

      - name: Enregistrement de construction de l'installateur
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: cargo xtask client-record --installer "target/release/bundle/nsis/Hearth_${VERSION}_x64-setup.exe" --version "$VERSION"

      - name: Installateur présent
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: test -f "target/release/bundle/nsis/Hearth_${VERSION}_x64-setup.exe"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hearth-client-installer
          path: |
            target/release/bundle/nsis/Hearth_${{ steps.version.outputs.version }}_x64-setup.exe
            target/release/bundle/nsis/Hearth_${{ steps.version.outputs.version }}_x64-setup.exe.build
          if-no-files-found: error
          retention-days: 3

  sign:
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: release
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.95"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hearth-client-installer
          path: installer

      # Aucun secret ici : on compile `xtask` (ses dépendances Cargo seulement, pas de npm) AVANT de
      # donner les secrets à l'étape qui signe, qui n'exécute plus que le binaire déjà construit.
      - name: Outil de signature
        shell: bash
        run: cargo build -p xtask --locked

      - name: Signature de l'installateur (seule étape qui voit la clé secrète)
        shell: bash
        env:
          HEARTH_CLIENT_SIGNING_KEY: ${{ secrets.HEARTH_CLIENT_SIGNING_KEY }}
          HEARTH_CLIENT_SIGNING_KEY_PASSWORD: ${{ secrets.HEARTH_CLIENT_SIGNING_KEY_PASSWORD }}
        run: |
          target/debug/xtask client-sign \
            --installer "installer/Hearth_${VERSION}_x64-setup.exe" \
            --version "$VERSION"

      - name: Manifeste latest.json
        shell: bash
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          printf '%s' "$NOTES" > installer/notes.txt
          target/debug/xtask client-manifest \
            --version "$VERSION" \
            --installer-file "installer/Hearth_${VERSION}_x64-setup.exe" \
            --notes-file installer/notes.txt \
            --signature-file "installer/Hearth_${VERSION}_x64-setup.exe.sig" \
            --url "https://hearth.voikyrioh.fr/api/releases/${VERSION}/Hearth_${VERSION}_x64-setup.exe" \
            --date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --out installer/latest.json

      # Aucune release GitHub, aucun droit d'écriture : le dossier `signed/` ne reçoit que ce que l'étape de
      # publication (xtask release-stage, sur la machine du propriétaire) doit lire. L'installateur non
      # signé de l'artefact de `build` n'est pas repris.
      - name: Rassembler l'artefact signé
        shell: bash
        run: |
          mkdir signed
          cp "installer/Hearth_${VERSION}_x64-setup.exe" \
             "installer/Hearth_${VERSION}_x64-setup.exe.sig"              "installer/Hearth_${VERSION}_x64-setup.exe.build" \
             installer/latest.json installer/notes.txt signed/
          sha256sum signed/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hearth-client-signed
          path: signed/
          if-no-files-found: error
          retention-days: 1
