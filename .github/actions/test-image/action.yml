name: Images des tests du moteur
description: >-
  busybox:1.36 et un registre local localhost:5000, fixés par empreinte (HRT-168). Cache de la CI d'abord,
  puis ECR, puis Docker Hub. Le cache est sauvé tout de suite après la préparation, même si le job finit rouge.
runs:
  using: composite
  steps:
    - id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/test-image
        key: engine-test-image-${{ hashFiles('.github/scripts/test-image.digests') }}
    - id: fetch
      shell: bash
      run: .github/scripts/test-image.sh "${{ runner.temp }}/test-image"
    - id: complete
      if: always()
      shell: bash
      run: |
        dir="${{ runner.temp }}/test-image"
        if [ -s "$dir/busybox.tar" ] && [ -s "$dir/registry.tar" ]; then echo "complete=true" >> "$GITHUB_OUTPUT"; else echo "::warning::cache non sauvé : archives manquantes ou vides"; fi
    - if: always() && steps.restore.outputs.cache-hit != 'true' && steps.complete.outputs.complete == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/test-image
        key: engine-test-image-${{ hashFiles('.github/scripts/test-image.digests') }}
